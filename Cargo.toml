[package]
name = "PaganRebuild"
version = "0.4.1"
edition = "2021"
description = "Engine reimplementation for Ultima VIII: Pagan (reads the original game data)"
license = "GPL-3.0-or-later"
repository = "https://github.com/scareglow23/PaganRebuild"
readme = "README.md"

[dependencies]
png = "0.17"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rodio = { version = "0.20", default-features = false }
rustysynth = "1.3.7"
wgpu = { version = "24", default-features = false, features = ["metal", "wgsl"] }
winit = "0.30"
pollster = "0.4"
gilrs = "0.11"
lewton = "0.10"

[profile.dev]
opt-level = 2

[profile.release]
debug = 1

# the system's MIDI synthesizer (music without a SoundFont), and the
# desktop's refresh to pace the pictures by (DwmFlush)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Media_Audio", "Win32_Media", "Win32_Graphics_Dwm"] }
# Held at versions that still link through import libraries: the newer
# ones need dlltool with an assembler, which the GNU toolchain lacks.
libloading = "=0.8.6"
parking_lot_core = "=0.9.10"
winapi-util = "=0.1.9"
